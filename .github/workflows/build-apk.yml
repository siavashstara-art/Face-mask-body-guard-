name: Build FaceGuard Studio Release & Debug Artifacts

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle and gradlew are ready
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "gradlew not found, generating wrapper..."
            gradle wrapper || true
          fi
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Setup Keystores (Debug and Release)
        run: |
          # 1. بازسازی فایل debug.keystore از روی base64 برای بیلد Debug
          if [ -f "debug.keystore.base64" ]; then
            echo "Restoring debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          else
            echo "Generating fallback debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 2. آماده‌سازی کلید امضای Release برای ساخت AAB و Release APK
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using custom release keystore from GitHub Secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
            echo "KEYSTORE_PATH=$(pwd)/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "Generating release signing keystore on runner..."
            keytool -genkey -v -keystore my-upload-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload -dname "CN=FaceGuard, OU=Mobile, O=FaceGuard, L=City, S=State, C=US" -storepass android -keypass android
            echo "KEYSTORE_PATH=$(pwd)/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          fi

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Build Release Bundle (AAB) & Release APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew bundleRelease assembleRelease --stacktrace
          else
            gradle bundleRelease assembleRelease --stacktrace
          fi

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FaceGuard-Studio-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - name: Upload Release Bundle (AAB)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FaceGuard-Studio-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore

      - name: Upload Release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FaceGuard-Studio-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
