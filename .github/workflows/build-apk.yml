name: Build FaceGuard Studio Release & Debug Artifacts

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew exists and is executable
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "gradlew not found, generating wrapper..."
            gradle wrapper
          fi
          chmod +x ./gradlew

      - name: Setup Keystore if Secrets Present
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
            echo "KEYSTORE_PATH=$(pwd)/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release Bundle & APK
        run: |
          ./gradlew bundleRelease assembleRelease --stacktrace || echo "Release build requires keystore configuration"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FaceGuard-Studio-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release Bundle (AAB)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FaceGuard-Studio-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore

      - name: Upload Release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FaceGuard-Studio-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
